<app-auth-shell>
  <h1 class="title">Register</h1>
  <p class="subtitle">Start buying and selling cards.</p>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row">
      <div class="group">
        <label class="label" for="name">Name</label>
        <input class="field" id="name" type="text" formControlName="name" autocomplete="given-name" />
      </div>
      <div class="group">
        <label class="label" for="surname">Surname</label>
        <input class="field" id="surname" type="text" formControlName="surname" autocomplete="family-name" />
      </div>
    </div>
    <div class="row">
      <div class="group">
        <label class="label" for="username">Username</label>
        <input class="field" id="username" type="text" formControlName="username" autocomplete="username" />
      </div>
      <div class="group">
        <label class="label" for="email">Email</label>
        <input class="field" id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
    </div>
    <div class="row">
      <div class="group">
        <label class="label" for="password">Password</label>
        <input class="field" id="password" type="password" formControlName="password" autocomplete="new-password" />
      </div>
      <div class="group">
        <label class="label" for="confirmPassword">Confirm password</label>
        <input class="field" id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </div>
    </div>
    <div class="group">
      <label class="label" for="phoneNumber">Phone number (optional)</label>
      <input class="field" id="phoneNumber" type="tel" formControlName="phoneNumber" autocomplete="tel" />
    </div>
    <div class="group">
      <label class="label" for="address">Address (optional)</label>
      <input class="field" id="address" type="text" formControlName="address" autocomplete="street-address" />
    </div>

    <div class="message">
      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }
    </div>

    <button class="submit" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Registering...' : 'Register' }}
    </button>
  </form>

  <p class="switch">Already a member? <a routerLink="/login">Log in</a></p>
</app-auth-shell>
