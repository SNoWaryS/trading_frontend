@if (result(); as result) {
  @if (result.cards.length) {
    <section class="similar" aria-labelledby="similar-title">
      <h2 class="title" id="similar-title">
        @if (result.basedOn === 'catalog') {
          Nobody is selling “{{ result.term }}” right now. Similar cards for sale
        } @else {
          Similar to “{{ result.term }}”
        }
      </h2>

      <ul class="list">
        @for (item of result.cards; track item.card.cardId) {
          <li>
            <button class="tile" type="button" (click)="open.emit(item.card)">
              <span class="picture">
                @if (item.card.cardPicture) {
                  <img [src]="item.card.cardPicture" alt="" loading="lazy" />
                }
              </span>
              <span class="meta">{{ cardMeta(item.card) }}</span>
              <span class="name">{{ item.card.cardName }}</span>
              <span class="price">{{ item.card.cardPrice | currency: 'THB' : 'symbol-narrow' : '1.0-0' }}</span>
            </button>
          </li>
        }
      </ul>
    </section>
  }
}
