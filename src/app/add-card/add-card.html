<dialog #dialog class="dialog" aria-labelledby="add-card-title" (close)="finish()" (keydown.escape)="close()">
  <form class="layout" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="picture-side">
      <label class="upload">
        <input
          #pictureInput
          class="upload-input"
          type="file"
          [accept]="pictureAccept"
          (change)="choosePicture(pictureInput)"
        />
        @if (picture(); as source) {
          <img class="preview" [src]="source" alt="Selected card picture" />
          <span class="upload-action">Change picture</span>
        } @else {
          <span class="placeholder">
            <span class="upload-action">Choose a picture</span>
            <span class="upload-hint">JPG, PNG or WebP, up to 5 MB</span>
          </span>
        }
      </label>
    </div>

    <div class="content">
      <h2 class="title" id="add-card-title">Add a card</h2>

      <div class="group">
        <label class="label" for="cardName">Card name</label>
        <input class="field" id="cardName" type="text" formControlName="cardName" maxlength="100" autocomplete="off" autofocus />
      </div>

      <div class="row">
        <div class="group">
          <label class="label" for="cardType">Type</label>
          <select class="field" id="cardType" formControlName="cardType">
            @for (type of cardTypes; track type) {
              <option [value]="type">{{ type }}</option>
            }
          </select>
        </div>
        <div class="group">
          <label class="label" for="rarity">Rarity</label>
          <select class="field" id="rarity" formControlName="rarity">
            <option value="">Select</option>
            @for (rarity of rarities; track rarity) {
              <option [value]="rarity">{{ rarity }}</option>
            }
          </select>
        </div>
      </div>

      <div class="row">
        <div class="group">
          <label class="label" for="cardElement">Element (optional)</label>
          <select class="field" id="cardElement" formControlName="cardElement">
            <option value="">None</option>
            @for (element of elements; track element) {
              <option [value]="element">{{ element }}</option>
            }
          </select>
        </div>
        <div class="group">
          <label class="label" for="cardStage">Stage (optional)</label>
          <select class="field" id="cardStage" formControlName="cardStage">
            <option value="">None</option>
            @for (stage of stages; track stage) {
              <option [value]="stage">{{ stage }}</option>
            }
          </select>
        </div>
      </div>

      <div class="row">
        <div class="group">
          <label class="label" for="cardPrice">Price (฿)</label>
          <input class="field" id="cardPrice" type="number" min="1" step="1" formControlName="cardPrice" />
        </div>
        <div class="group">
          <label class="label" for="referencePrice">Reference price (optional)</label>
          <input class="field" id="referencePrice" type="number" min="0" step="1" formControlName="referencePrice" />
        </div>
      </div>

      <div class="group">
        <label class="label" for="cardDescription">Description (optional)</label>
        <textarea class="field description" id="cardDescription" rows="2" maxlength="1000" formControlName="cardDescription"></textarea>
      </div>

      <div class="message">
        @if (errorMessage()) {
          <p class="error" role="alert">{{ errorMessage() }}</p>
        }
      </div>

      <div class="actions">
        <button class="button secondary" type="button" (click)="close()">Cancel</button>
        <button class="button primary" type="submit">List card</button>
      </div>
    </div>
  </form>
</dialog>
