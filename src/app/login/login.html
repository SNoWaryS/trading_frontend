<app-auth-shell>
  <h1 class="title">Log in</h1>


  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="group">
      <label class="label" for="username">Username</label>
      <input class="field" id="username" type="text" formControlName="username" autocomplete="username" />
    </div>
    <div class="group">
      <label class="label" for="password">Password</label>
      <input class="field" id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    <div class="message">
      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }
      @if (justRegistered() && !errorMessage()) {
        <p class="success" role="status">Account created. Please log in.</p>
      }
      @if (accountDeleted() && !errorMessage()) {
        <p class="success" role="status">Your account has been deleted.</p>
      }
    </div>

    <button class="submit" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Logging in...' : 'Log in' }}
    </button>
  </form>

  <p class="switch">New here? <button class="switch-link" type="button" (click)="policyOpen.set(true)">Register</button></p>
</app-auth-shell>

@if (policyOpen()) {
  <app-privacy-policy (accepted)="acceptPolicy()" (declined)="policyOpen.set(false)" />
}
